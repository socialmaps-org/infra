---
- name: Setup WireGuard
  hosts: singleton
  gather_facts: true

  tasks:
    # Prefer this over `vars_files` as that requires decrypting
    # the vault just for linting.
    - name: Load secrets
      ansible.builtin.include_vars:
        file: secrets.yaml
      no_log: true

    - name: Install WireGuard packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 43200  # 12 hours
        pkg:
          - wireguard
          - wireguard-tools

    - name: Copy the config
      ansible.builtin.template:
        src: ./assets/server-wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: u=rw,g=r,o=r

    - name: Restart `wg-quick@wg0` service
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        enabled: true
        state: restarted
