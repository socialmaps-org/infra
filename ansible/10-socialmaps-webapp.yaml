---
- name: Configure Social Maps Web App
  hosts: singleton
  gather_facts: true

  tasks:
    - name: Start socialmaps-webapp container
      community.docker.docker_container:
        name: socialmaps-webapp
        image: gitlab.com/socialmaps/webapp:latest
        pull: always
        recreate: true
        restart_policy: unless-stopped
        networks:
          - name: service-bridge
